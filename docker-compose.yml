services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-humanlayer}
    # DB port exposed to host only for local debugging; not required
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: infra/server.Dockerfile
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-humanlayer}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-dev-secret}
      APP_USER_EMAIL: ${APP_USER_EMAIL:-reviewer@example.com}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-reviewer}
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: infra/ui.Dockerfile
      args:
        VITE_API_URL: http://localhost:${SERVER_PORT:-3000}
    ports:
      - "${UI_PORT:-5173}:5173"
    depends_on:
      - server

  agent-runner:
    build:
      context: .
      dockerfile: infra/agent.Dockerfile
    # No ports exposed — agent connects outbound only
    environment:
      SERVER_URL: ws://server:3000
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-dev-secret}
      AGENT_NAME: agent-docker
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - ./workspace:/workspace
    depends_on:
      - server

volumes:
  pgdata:
